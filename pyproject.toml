[project]
name = "lunar-crater-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "python-dotenv>=1.2.2",
    "roboflow>=1.3.10",
    "scipy>=1.17.1",
    "timm>=1.0.27",
    "torch>=2.11.0",
    "torchmetrics[detection]>=1.9.0",
    "torchvision>=0.26.0",
    "transformers>=5.12.0",
]
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
